


plugins {
    id 'java-library'
    id 'io.qameta.allure' version '4.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation (
            "com.codeborne:selenide:7.16.2",
            "org.junit.jupiter:junit-jupiter:5.9.3",
            'com.github.javafaker:javafaker:1.0.2',
            'io.qameta.allure:allure-junit5:2.33.0',
            'io.qameta.allure:allure-selenide:2.33.0',
            'org.junit.platform:junit-platform-launcher',
            'org.slf4j:slf4j-simple:2.0.18'
    )
}

allure {
    version = "2.33.0"
    adapter {
        frameworks {
            junit5 {
                enabled = true
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    useJUnitPlatform()
    ignoreFailures = true

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}

test {
    useJUnitPlatform()
}
